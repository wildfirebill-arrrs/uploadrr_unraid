services:
  uploadrr:
    build: .
    image: ghcr.io/wildfirebill-arrrs/uploadrr_unraid:latest
    container_name: uploadrr_unraid
    restart: unless-stopped
    # Required for rclone mount (FUSE) inside the container; remove if not mounting in-container
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    # Keep the container alive so you can exec into it for CLI usage.
    # Override entrypoint/command to run a one-shot upload instead, e.g.:
    #   docker compose run --rm uploadrr /data/movie.mkv --trackers BLU HDB
    entrypoint: tail
    command: -f /dev/null
    volumes:
      # Configuration (config.yaml lives here)
      - /mnt/cache/appdata/arrrs/uploadrr/data:/app/data:rw
      # Temporary/working files
      - /mnt/cache/appdata/arrrs/uploadrr/tmp:/app/tmp:rw
      # Screenshot temp pics
      - /mnt/user/data/arrs/temp_pics:/app/temp_pics:rw
      # Media to upload (map to your download client's container path)
      - /mnt/user/data/torrents:/data:rw
      # qBittorrent (or other client) BT_backup for torrent storage reuse
      - /mnt/cache/appdata/arrrs/qbittorrent/data/BT_backup:/torrent_storage_dir:rw
      # Seedbox mount point (mount via rclone on host, or exec into container)
      - /mnt/user/seedbox:/seedbox:rw
      # rclone config (optional, for in-container mounts)
      - /mnt/cache/appdata/arrrs/uploadrr/rclone:/root/.config/rclone:rw
    environment:
      - PUID=99
      - PGID=100
      - TZ=America/New_York
    networks:
      - bridge

networks:
  bridge:
    driver: bridge