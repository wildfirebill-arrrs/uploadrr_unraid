DEFAULT:
  tmdb: TMDB_API_KEY
  add_trailer: false
  add_logo: true
  default_torrent_client: Client1
  sfx_on_prompt: true
  always_anon: false
  torrent_creation: torf # options: mkbrr, mktorren, torf (default)


ADULT:
  API_KEYS:
    porndb: null
    ptscreens:  null
    hamster: null
    imghost: null
    catbox: null 
  always_anon: true # makes all adult uploads anon
  use_phash: true
  contact_sheet:
    pack_max: 6  

SCREENS:  
  API_KEYS: # pixthost, imgbox , fastpic dont need api keys (catbox says it doent but fails w/o)
    imgbb: null
    lensdump: null
    ptscreens: null
    onlyimage: null
    catbox: null
    passtheimage: null
    digitalclub: null
    utp: null
    hawke: null
  img_hosts: [ptscreens, onlyimage, hamster, imghost, imgbox, catbox, imgbb, lensdump, pixhost, fastpic, digitalclub, passtheimage, utp, hawke] # order dictates prefrence!
  screen_count: 6
  per_episode: 3 # for tv will take x screens for every episode put them in spoiler
  img_size: 500
  deinterlace_method: yadif
  tonemap_hdr: true
  # Other presets: "hable:desat=0" (color accurate but dark) or "mobius:desat=10" (more pop sometimes) , or try your own!
  hdr_method: "reinhard:desat=0" 
  optimize: true       # you can set 0-9 for compression lvl if desired.
  use_oxipng: false    # slower but smaller PNGs; requires pip install pyoxipng
  keyframes_only: true # will snap pics on i-frame
  frame_stats: false     # adds frame stats to image

SIGNATURES:
  # Use custom per tracker, fallback to global (False, only use tracker sigs if avail / True, only use global, None, no sigs)
  use_global_sigs: default 
  # These signatures below are for GLOBAL or used as fallback if using default 
  # >>> to adjust per tracker, simply add the same keys below tracker of choice
  # change sigs to "uploadrr" to get simple "Uploadrr {version}" on bottom right
  signature: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=400]https://i.ibb.co/2NVWb0c/uploadrr.webp[/img][/url][/center]"
  anon_signature: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=40]https://images2.imgbox.com/5f/1a/bGk73WZU_o.png[/img][/url][/center]"
  pr_signature: "\n[center][size=6][b]Personal Release[/b][/size][/center]\n[center][url=https://codeberg.org/CvT/Uploadrr][img=400]https://i.ibb.co/2NVWb0c/uploadrr.webp[/img][/url][/center]"
  anon_pr_signature: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=40]https://images2.imgbox.com/5f/1a/bGk73WZU_o.png[/img][/url][/center]"

AUTO:
  description_folder: null    # "Path/To/description/folder" see wiki for details
  delay: 0                    # Seconds to wait between uploads (0 = no delay)
  size_tolerance: 1           # Max %% file-size difference allowed when matching dupes (1-100)
  dupe_similarity: 80         # Minimum name similarity %% to flag a torrent as a duplicate (70-100)
  always_aid: true            # Auto-fetch description even when --auto-desc is not passed
  hide_queue: false           # Suppress the "Queuing these files" list (override with --hide-queue / -hq)
  trusted_uploaders: [GME, Roronoa_Zoro, x64] # Add-in trusted uploaders here or change to "USE_ALL" (if everyones trusted, this is for api description snatching)

