# ============================================================================== #
# TORRENT CLIENTS
# ============================================================================== #
#
# LOCAL / REMOTE PATH MAPPING
# ---------------------------
#
# Formats:
#   Single pair (one shared mapping):
#     local_path: "/mnt/nas/media"         # path as seen on THIS machine
#     remote_path: "/home/user/media"      # path as seen by the torrent client
#
#   Multiple pairs (match by upload location, first match wins):
#     local_path:
#       - "/mnt/nas/movies"
#       - "/mnt/nas/tv"
#     remote_path:
#       - "/data/media/movies"
#       - "/data/media/tv"
#
# Examples:
#   - Windows Docker:    local_path: "C:\\Media"        → remote_path: "/data/media"
#   - Unraid/Synology:   local_path: "/mnt/user/media"  → remote_path: "/media"
#   - SSH/NFS mount:     local_path: "/mnt/remote/share" → remote_path: "/home/user/share"
#   - Unraid + Docker:   local_path: "/mnt/user/media"  → remote_path: "/mnt/user/media"
#                        (same mount, both sides see identical path — omit if identical)
#
# If omitted, defaults to "/LocalPath" → "/RemotePath" (effectively no mapping).
# Path matching is prefix-based: a file under /mnt/nas/movies/Action.mkv matches
# local_path "/mnt/nas/movies". Trailing slashes are ignored.
# ============================================================================== #

TORRENT_CLIENTS:
  Client1:
    torrent_client: qbit
    qbit_url: http://127.0.0.1
    qbit_port: '8080'
    qbit_user: qbit_username
    qbit_pass: qbit_password
    # local_path: "/Users/you/Downloads"
    # remote_path: "/data/downloads"

  qbit:
    torrent_client: qbit
    enable_search: true
    qbit_url: http://127.0.0.1
    qbit_port: '8080'
    qbit_user: qbit_username
    qbit_pass: qbit_username
    torrent_storage_dir: /Users/example/Library/Application Support/qBittorrent/BT_backup
    content_layout: Original
    VERIFY_WEBUI_CERTIFICATE: false
    # Single mapping:
    # local_path: "/Users/example/Movies"
    # remote_path: "/data/media"
    #
    # Or multiple mappings (first match wins):
    # local_path:
    #   - "/Users/example/Movies"
    #   - "/Users/example/TV"
    # remote_path:
    #   - "/data/media/movies"
    #   - "/data/media/tv"

  rtorrent:
    torrent_client: rtorrent
    rtorrent_url: https://user:password@server.host.tld:443/username/rutorrent/plugins/httprpc/action.php
    # SSH/NFS mounted share example:
    # local_path: "/mnt/remote/media"
    # remote_path: "/home/user/media"

  deluge:
    torrent_client: deluge
    deluge_url: localhost
    deluge_port: '8080'
    deluge_user: deluge_username
    deluge_pass: deluge_password
    # local_path: "/home/user/downloads"
    # remote_path: "/downloads"

  transmission:
    torrent_client: transmission
    transmission_url: http://localhost:9091
    transmission_user: trans_username
    transmission_pass: trans_password
    torrent_storage_dir: /.config/transmission-daemon/Torrents/
    enable_search: true
    # local_path: "/mnt/remote/torrents"
    # remote_path: "/var/lib/transmission/downloads"

  watch:
    torrent_client: watch
    watch_folder: /Path/To/Watch/Folder
    # Watch folder only copies the .torrent file — no path mapping needed.
